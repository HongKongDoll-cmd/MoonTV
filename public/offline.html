<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网络连接不可用 · MoonTV</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b0f14;
        color: #e5e7eb;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.125rem;
        font-weight: 500;
      }
      p {
        margin: 0 0 24px;
        font-size: 0.875rem;
        line-height: 1.7;
        color: #9ca3af;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 9px 22px;
        font-size: 0.875rem;
        color: #fff;
        background: #22c55e;
        cursor: pointer;
      }
      button:hover {
        background: #16a34a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg
          width="30"
          height="30"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#9ca3af"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>网络连接不可用</h1>
      <p>
        当前设备处于离线状态，无法加载页面内容。<br />
        恢复网络后点击下方按钮重试。
      </p>
      <button type="button" onclick="location.reload()">重新加载</button>
    </main>
  </body>
</html>
